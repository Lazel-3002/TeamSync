# Otomatik sürüm yayınlama:
# main'e push gelince package.json'daki version okunur; o versiyonun GitHub
# release'i YOKSA installer derlenir ve release olarak yayınlanır. Kurulu
# uygulamalar (electron-updater) bir sonraki açılışta güncellemeyi alır.
#
# Yani güncelleme çıkarmak için tek gereken:
#   1) package.json'da "version"ı yükselt (örn. 1.0.0 -> 1.0.1)
#   2) git push
# Version yükseltilmeden yapılan push'lar hiçbir şey yayınlamaz (güvenli).
# Etiket (vX.Y.Z) elle atılmaz, aşağıda otomatik oluşturulur.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bu versiyon zaten yayınlanmış mı?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION zaten var, yayın atlanıyor."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION yeni, derlenip yayınlanacak."
          fi

      # Etiket, derlemeden ÖNCE var olmalı. package.json'da releaseType "release"
      # olduğu için electron-builder taslak değil, doğrudan yayınlanmış bir
      # release oluşturmaya çalışır; GitHub ise var olmayan bir etikete
      # yayınlanmış release açmayı reddeder:
      #   422 — "Published releases must have a valid tag"
      # v1.0.6'da tam olarak bu oldu: istek reddedildi ama blockmap yüklenmiş
      # olduğu için ortada .exe'si ve latest.yml'si olmayan, yarım ve yayında
      # bir release kaldı. Etiketi önden atınca electron-builder var olan bir
      # etikete yayınlar ve bu hata oluşamaz.
      - name: Sürüm etiketini oluştur
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION etiketi zaten var, oluşturma atlanıyor."
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "v$VERSION etiketi oluşturuldu ve push'landı."
          fi

      - name: Bağımlılıkları kur
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      # electron-builder'a yayınlatmıyoruz: .exe ve .blockmap'i paralel yüklerken
      # ikisi de "release yok" görüp aynı etikete AYRI AYRI release açıyordu
      # (v1.0.6, 1.0.8, 1.0.9, 1.0.10). GitHub etiket sayfasında ve indirme
      # bağlantılarında yalnızca .blockmap'li kopyayı gösterdiği için kullanıcılar
      # exe'yi göremiyor, latest.yml de 404 verdiği için güncelleme gelmiyordu.
      # Bu yüzden yalnızca derliyoruz; yükleme aşağıda tek bir komutla yapılıyor.
      - name: Derle
        if: steps.check.outputs.exists == 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Tek release olarak yayınla
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          FILES=("dist/TeamSync-Setup-$VERSION.exe" "dist/TeamSync-Setup-$VERSION.exe.blockmap" "dist/latest.yml")
          for f in "${FILES[@]}"; do
            [ -f "$f" ] || { echo "Eksik dosya: $f"; exit 1; }
          done
          gh release create "v$VERSION" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" --notes ""

      # Workflow'un yeşil olması indirmenin çalıştığını göstermiyordu; burada
      # gerçekten indirilebildiğini doğrula.
      - name: İndirme bağlantılarını doğrula
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          for f in "TeamSync-Setup-$VERSION.exe" "latest.yml"; do
            for i in 1 2 3 4 5 6; do
              CODE=$(curl -s -o /dev/null -I -L -w '%{http_code}' "$BASE/$f")
              [ "$CODE" = "200" ] && break
              sleep 20
            done
            echo "$f -> $CODE"
            [ "$CODE" = "200" ] || exit 1
          done
